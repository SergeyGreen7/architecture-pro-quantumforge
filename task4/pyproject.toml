[project]
name = "quantumforge-rag-bot"
version = "0.1.0"
description = "Telegram RAG bot with local BGE-M3 retrieval and YandexGPT generation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastapi>=0.121,<1",
    "httpx>=0.28,<1",
    "sentence-transformers==5.7.0",
    "uvicorn[standard]>=0.38,<1",
    "yandex-ai-studio-sdk>=0.19,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumforge_bot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

